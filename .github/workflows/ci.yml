name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    name: unit + CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guest harness (portable backend)
        run: make -C guest/build
      - name: Run test suite
        run: python -m unittest discover -s tests -v
